apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: default
type: Opaque
data:
  # PostgreSQL Configuration
  POSTGRES_PASSWORD: ""
  POSTGRES_USER: ""
  POSTGRES_DB: ""
  PGDATA: ""
  
  # S3 Configuration for pgBackRest
  S3_BUCKET_NAME: ""
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_ACCESS_KEY_SECRET: ""
  S3_REGION: ""
  
  # pgBackRest Configuration
  REPO1_RETENTION_FULL: ""
  STANZA_NAME: ""
  ARCHIVE_TIMEOUT: ""
  MAX_WAL_SENDERS: ""
  WAL_KEEP_SIZE: ""