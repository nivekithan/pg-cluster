---
apiVersion: v1
kind: Namespace
metadata:
  name: inital
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inital-deploy
  namespace: inital
  labels:
    app: inital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inital
  template:
    spec:
      containers:
        - name: inital
          image: crccheck/hello-world
          ports:
            - name: inital-port
              containerPort: 8000
    metadata:
      labels:
        app: inital
---
apiVersion: v1
kind: Service
metadata:
  name: inital-service
  namespace: inital
  labels:
    app: inital
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: inital-port
  selector:
    app: inital
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: inital
spec:
  redirectRegex:
    regex: "^http://(.*)"
    replacement: "https://$1"
    permanent: true
---
# HTTP Ingress (redirects)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inital-ingress-http
  namespace: inital
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: inital-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kube.nivekithan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inital-service
                port:
                  number: 80
---
# HTTPS Ingress (serves content)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inital-ingress-https
  namespace: inital
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/issuer: initial-tls-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kube.nivekithan.com
      secretName: initial-tls-secret
  rules:
    - host: kube.nivekithan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inital-service
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: initial-tls-issuer
  namespace: inital
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nivekithan363@gmail.com
    profile: tlsserver
    privateKeySecretRef:
      name: initial-tls-private-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
